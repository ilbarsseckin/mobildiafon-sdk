<title>Ziyaretçi Paneli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --ink:#12151b; --muted:#5b6472;
    --line:#dfe4ea; --line2:#eceff3;
    --accent:#159a5b; --accent-ink:#ffffff; --accent-soft:#e4f4ec;
    --key:#f5f7f9; --key-press:#e7ebef; --danger:#c0392b;
    --shadow:0 1px 2px rgba(18,21,27,.06),0 8px 24px rgba(18,21,27,.08);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d1014; --card:#161b22; --ink:#eef1f5; --muted:#93a0b0;
    --line:#262d37; --line2:#1d232c;
    --accent:#2bb673; --accent-ink:#04140b; --accent-soft:#12281d;
    --key:#1c232c; --key-press:#242d38;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0d1014; --card:#161b22; --ink:#eef1f5; --muted:#93a0b0;
    --line:#262d37; --line2:#1d232c;
    --accent:#2bb673; --accent-ink:#04140b; --accent-soft:#12281d;
    --key:#1c232c; --key-press:#242d38;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:Manrope,-apple-system,system-ui,sans-serif;line-height:1.4;
    display:flex;justify-content:center}
  .wrap{width:100%;max-width:420px;padding:16px;padding-block:18px;display:flex;flex-direction:column;gap:14px;min-height:100%}

  .top{display:flex;align-items:center;gap:12px}
  .badge{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);
    display:grid;place-items:center;flex:none}
  .badge svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8}
  .title{font-weight:800;font-size:19px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}

  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line2);
    border:1px solid var(--line);border-radius:14px;padding:5px}
  .tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;
    padding:10px;border-radius:10px;cursor:pointer;font-size:14.5px}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

  /* --- Daireler --- */
  .search{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .search input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;width:100%;outline:none}
  .search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
  .list{max-height:none;overflow:auto}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .row:last-child{border-bottom:0}
  .no{width:40px;height:40px;border-radius:11px;background:var(--key);display:grid;place-items:center;
    font-weight:800;font-size:15px;flex:none;font-variant-numeric:tabular-nums}
  .who{flex:1;min-width:0}
  .who b{font-weight:700;font-size:15px}
  .who span{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
  .call{border:0;background:var(--accent);color:var(--accent-ink);width:42px;height:42px;border-radius:12px;
    display:grid;place-items:center;cursor:pointer;flex:none}
  .call svg{width:20px;height:20px;fill:currentColor}

  /* --- Numaratör --- */
  .pad{padding:16px;display:flex;flex-direction:column;gap:14px}
  .display{background:var(--key);border:1px solid var(--line);border-radius:14px;
    min-height:64px;padding:12px 16px;display:flex;align-items:center;justify-content:center;
    font-family:"Roboto Mono",ui-monospace,monospace;font-size:30px;font-weight:600;
    letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--ink);word-break:break-all}
  .display.empty{color:var(--muted);font-size:15px;font-family:Manrope,sans-serif;letter-spacing:0;font-weight:600}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .k{border:1px solid var(--line);background:var(--key);color:var(--ink);font:inherit;font-weight:700;
    font-size:22px;padding:16px 0;border-radius:14px;cursor:pointer;font-variant-numeric:tabular-nums;
    -webkit-tap-highlight-color:transparent}
  .k:active{background:var(--key-press);transform:translateY(1px)}
  .k small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-top:2px}
  .actions{display:grid;grid-template-columns:56px 1fr;gap:10px}
  .del{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:14px;cursor:pointer;display:grid;place-items:center}
  .del svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
  .ara{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;font-size:17px;
    border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
  .ara svg{width:19px;height:19px;fill:currentColor}
  .hint{color:var(--muted);font-size:12.5px;font-weight:600;text-align:center;line-height:1.5}
  .hint b{color:var(--ink);font-family:"Roboto Mono",monospace}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;
    box-shadow:var(--shadow);opacity:0;transition:opacity .18s, transform .18s;pointer-events:none;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
  .toast.ok{background:var(--accent);color:var(--accent-ink)}
</style>

<div class="wrap">
  <div class="top">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M9 21.5v-3.5h6v3.5"/><circle cx="15.2" cy="12" r="1.1" fill="var(--accent)" stroke="none"/></svg>
    </div>
    <div>
      <div class="title">Yıldız Apartmanı</div>
      <div class="sub">Ziyaretçi · Kapı</div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-list" aria-selected="true" aria-controls="p-list">Daireler</button>
    <button class="tab" role="tab" id="t-pad" aria-selected="false" aria-controls="p-pad">Numaratör</button>
  </div>

  <!-- DAİRE LİSTESİ -->
  <section class="card" id="p-list" role="tabpanel" aria-labelledby="t-list">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" placeholder="Daire no veya isim ara" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- NUMARATÖR -->
  <section class="card" id="p-pad" role="tabpanel" aria-labelledby="t-pad" hidden>
    <div class="pad">
      <div class="display empty" id="disp">Daire no veya kapı kodu</div>
      <div class="keys" id="keys">
        <button class="k">1</button><button class="k">2</button><button class="k">3</button>
        <button class="k">4</button><button class="k">5</button><button class="k">6</button>
        <button class="k">7</button><button class="k">8</button><button class="k">9</button>
        <button class="k">*</button><button class="k">0</button><button class="k">#<small>kapı kodu</small></button>
      </div>
      <div class="actions">
        <button class="del" id="del" aria-label="Sil">
          <svg viewBox="0 0 24 24"><path d="M20 6H9L4 12l5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Z"/><path d="m17 10-4 4m0-4 4 4"/></svg>
        </button>
        <button class="ara" id="ara">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.5 11.5 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1 11.5 11.5 0 0 0 .58 3.6 1 1 0 0 1-.25 1Z"/></svg>
          Ara
        </button>
      </div>
      <p class="hint">Daireyi arayınca sakinin telefonu çalar.<br>Kapı şifresi biliyorsanız <b>••••#</b> girin.</p>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var apts=[
    {no:"1",name:"Zemin kat"},{no:"2",name:"1. kat sol"},{no:"3",name:"1. kat sağ"},
    {no:"4",name:"2. kat sol"},{no:"5",name:"2. kat sağ"},{no:"6",name:"3. kat sol"},
    {no:"7",name:"3. kat sağ"},{no:"8",name:"4. kat sol"},{no:"12",name:"Çatı katı"}
  ];
  var $=function(s){return document.querySelector(s)};
  var toast=$("#toast"),tmo;
  function say(msg,ok){toast.textContent=msg;toast.className="toast show"+(ok?" ok":"");
    clearTimeout(tmo);tmo=setTimeout(function(){toast.className="toast"},1900)}

  // tabs
  var tl=$("#t-list"),tp=$("#t-pad"),pl=$("#p-list"),pp=$("#p-pad");
  function sel(which){
    var pad=which==="pad";
    tp.setAttribute("aria-selected",pad);tl.setAttribute("aria-selected",!pad);
    pp.hidden=!pad;pl.hidden=pad;
  }
  tl.onclick=function(){sel("list")};tp.onclick=function(){sel("pad")};

  // list
  function callApt(no){say("Daire "+no+" aranıyor…",true)}
  function render(f){
    f=(f||"").toLowerCase().trim();
    var host=$("#list");host.innerHTML="";
    apts.filter(function(a){return !f||a.no.indexOf(f)===0||a.name.toLowerCase().indexOf(f)>=0})
    .forEach(function(a){
      var r=document.createElement("div");r.className="row";
      r.innerHTML='<div class="no">'+a.no+'</div>'+
        '<div class="who"><b>Daire '+a.no+'</b><span>'+a.name+'</span></div>'+
        '<button class="call" aria-label="Ara"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.5 11.5 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1 11.5 11.5 0 0 0 .58 3.6 1 1 0 0 1-.25 1Z"/></svg></button>';
      r.querySelector(".call").onclick=function(){callApt(a.no)};
      host.appendChild(r);
    });
    if(!host.children.length){host.innerHTML='<div class="row" style="color:var(--muted);font-weight:600">Sonuç yok</div>'}
  }
  $("#q").addEventListener("input",function(e){render(e.target.value)});
  render();

  // numerator
  var val="",disp=$("#disp");
  function paint(){
    if(val){disp.textContent=val;disp.classList.remove("empty")}
    else{disp.textContent="Daire no veya kapı kodu";disp.classList.add("empty")}
  }
  $("#keys").addEventListener("click",function(e){
    var b=e.target.closest(".k");if(!b)return;
    var ch=b.firstChild.textContent.trim();
    if(ch==="#"){ // kapı kodu gönder
      if(val.length){say("Kapı kodu kontrol ediliyor…");val="";paint()}
      return;
    }
    if(val.length<8){val+=ch;paint()}
  });
  $("#del").onclick=function(){val=val.slice(0,-1);paint()};
  $("#ara").onclick=function(){
    if(!val){say("Önce daire numarası girin");return}
    say("Daire "+val+" aranıyor…",true);val="";paint();
  };
})();
</script>
